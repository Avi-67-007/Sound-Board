<!DOCTYPE html>
<html>
<head>
  <title>Simple Soundboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Soundboard</h1>

  <div class="buttons">
    <button class="btn" data-sound="sounds/dog-barking-406629.mp3">Dog</button>
    <button class="btn" data-sound="sounds/applause-383901.mp3">Clap</button>
    <button class="btn" data-sound="sounds/pop-402324 (1).mp3">Pop</button>
    <button class="btn" data-sound="sounds/mischievous-laugh-398655.mp3">Laugh</button>
  </div>

  <div class="controls">
    <label>Volume</label>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="1">
    <button id="mute">Mute</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
